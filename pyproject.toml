[project]
name = "findocqa"
version = "0.1.0"
description = "RAG system over SEC financial filings (FinanceBench)"
requires-python = ">=3.11"
dependencies = [
    "llama-index>=0.11",
    "qdrant-client>=1.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "pymupdf>=1.24",
    "ragas==0.3.9",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
    "torch>=2.9,<2.12",
    "openai>=2.54.0",
    "requests>=2.34.2",
    "datasets>=5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
